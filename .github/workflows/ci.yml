name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  phase0-static-and-unit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: recursive
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Bootstrap deterministic development environment
        run: ./scripts/bootstrap-dev.sh
      - name: Validate Phase 0 artifacts and topology
        run: ./scripts/validate-phase0.sh
      - name: Run workspace unit suites
        run: ./scripts/test-unit.sh
      - name: Validate Phase 1 trusted-principal boundaries
        run: ./scripts/test-phase1.sh

  powershell-wrapper-static:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Parse thin PowerShell wrapper
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path scripts/unison.ps1),
            [ref]$tokens,
            [ref]$errors
          ) | Out-Null
          if ($errors.Count -gt 0) {
            $errors | Format-List | Out-String | Write-Error
            exit 1
          }

  python-security:
    uses: project-unisonOS/.github/.github/workflows/reusable-python-security.yml@317183a033ed22031a06d6a757f55fd482f0c63f
    with:
      python-version: "3.12"
      working-directory: "."
