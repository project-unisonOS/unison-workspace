name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  phase0-static-and-unit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Bootstrap deterministic development environment
        run: ./scripts/bootstrap-dev.sh
      - name: Validate Phase 0 artifacts and topology
        run: ./scripts/validate-phase0.sh
      - name: Run workspace unit suites
        run: ./scripts/test-unit.sh
      - name: Validate Phase 1 trusted-principal boundaries
        run: ./scripts/test-phase1.sh
      - name: Validate Phase 2 governed-context boundaries
        run: ./scripts/test-phase2.sh
      - name: Validate Phase 3 trust-governance boundaries
        run: ./scripts/test-phase3.sh
      - name: Validate Phase 4 two-assistant household proof
        run: ./scripts/test-phase4.sh
      - name: Validate Phase 5 channel gateway and exposure
        run: ./scripts/test-phase5.sh
      - name: Validate Phase 6 provider-blind backup and replacement restore
        run: ./scripts/test-phase6.sh

  phase6-s3-compatible-backend:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Bootstrap deterministic development environment
        run: ./scripts/bootstrap-dev.sh
      - name: Start pinned MinIO profile
        run: docker compose -f compose.phase6-minio.yml up -d --wait
      - name: Validate S3-compatible backup, verification, and restore
        run: |
          PYTHONPATH="${PWD}/unison-common/src:${PWD}/unison-storage" \
            .venv/bin/python scripts/test-phase6-minio.py
      - name: Show MinIO logs after failure
        if: failure()
        run: docker compose -f compose.phase6-minio.yml logs
      - name: Stop MinIO profile
        if: always()
        run: docker compose -f compose.phase6-minio.yml down --volumes

  powershell-wrapper-static:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Parse thin PowerShell wrapper
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path scripts/unison.ps1),
            [ref]$tokens,
            [ref]$errors
          ) | Out-Null
          if ($errors.Count -gt 0) {
            $errors | Format-List | Out-String | Write-Error
            exit 1
          }

  python-security:
    uses: project-unisonOS/.github/.github/workflows/reusable-python-security.yml@7b392529550f2963dc0022428e873ddb17cdedd4
    with:
      python-version: "3.12"
      working-directory: "."
      dependency-file: requirements-dev.lock
      checkout-submodules: true
      unison-common-ref: "8b82c2fe26b31aa4b368eb150654e0dd3561fa58"
      pytest-targets: tests/security
      trivy-scan-ref: requirements-dev.lock
      # Container ingress binds and non-production fallback paths are reviewed separately.
      bandit-skips: "B104,B108"
