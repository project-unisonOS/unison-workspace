name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  phase0-static-and-unit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Bootstrap deterministic development environment
        run: ./scripts/bootstrap-dev.sh
      - name: Validate Phase 0 artifacts and topology
        run: ./scripts/validate-phase0.sh
      - name: Validate agent task packets
        run: .venv/bin/python scripts/validate-task-packets.py
      - name: Run workspace unit suites
        run: ./scripts/test-unit.sh
      - name: Validate synthetic wellness across authenticated storage and ingress
        env:
          OTEL_SDK_DISABLED: 'true'
          UNISON_DISABLE_OTEL_EXPORTER: 'true'
        run: .venv/bin/python -m pytest tests/integration/test_wellness_storage_journey.py tests/integration/test_export_health_pilot.py tests/integration/test_source_delegation.py -q
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
      - name: Install locked browser test dependencies
        working-directory: unison-experience-renderer
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Validate synthetic browser consent and retained-authority restore
        env:
          OTEL_SDK_DISABLED: 'true'
          UNISON_DISABLE_OTEL_EXPORTER: 'true'
          UNISON_BROWSER_EVIDENCE: ${{ runner.temp }}/health-browser-evidence
        run: .venv/bin/python -m pytest tests/integration/test_health_browser.py -q
      - name: Preserve synthetic browser evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: synthetic-health-browser-evidence
          path: ${{ runner.temp }}/health-browser-evidence/
      - name: Validate Phase 1 trusted-principal boundaries
        run: ./scripts/test-phase1.sh
      - name: Validate Phase 2 governed-context boundaries
        run: ./scripts/test-phase2.sh
      - name: Validate Phase 3 trust-governance boundaries
        run: ./scripts/test-phase3.sh
      - name: Validate Phase 4 two-assistant household proof
        run: ./scripts/test-phase4.sh
      - name: Validate Phase 5 channel gateway and exposure
        run: ./scripts/test-phase5.sh
      - name: Validate Phase 6 provider-blind backup and replacement restore
        run: ./scripts/test-phase6.sh
      - name: Validate Phase 7 bounded high-value workflows
        run: ./scripts/test-phase7.sh
      - name: Validate Phase 8 initial ecosystem expansion
        run: ./scripts/test-phase8.sh
      - name: Validate Phase 9 scope and hardware deferral ledger
        run: ./scripts/validate-phase9.sh
      - name: Validate Phase 10 adaptive maintenance AM-0 through AM-3
        run: ./scripts/validate-phase10.sh

  phase6-s3-compatible-backend:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Bootstrap deterministic development environment
        run: ./scripts/bootstrap-dev.sh
      - name: Validate S3-compatible backup with digest-verified MinIO
        run: bash scripts/test-phase6-minio-ci.sh

  powershell-wrapper-static:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Parse thin PowerShell wrapper
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path scripts/unison.ps1),
            [ref]$tokens,
            [ref]$errors
          ) | Out-Null
          if ($errors.Count -gt 0) {
            $errors | Format-List | Out-String | Write-Error
            exit 1
          }

  python-security:
    uses: project-unisonOS/.github/.github/workflows/reusable-python-security.yml@7b392529550f2963dc0022428e873ddb17cdedd4
    with:
      python-version: "3.12"
      working-directory: "."
      dependency-file: requirements-dev.lock
      checkout-submodules: true
      unison-common-ref: "fee681b76a045531a9d687544cf2f3c2b34c705a"
      pytest-targets: tests/security
      trivy-scan-ref: requirements-dev.lock
      # Container ingress binds and non-production fallback paths are reviewed separately.
      bandit-skips: "B104,B108"
