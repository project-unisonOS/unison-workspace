name: Approved synthetic CPU model experiment
on:
  # Dedicated one-off experiment PR: no push, synchronize or schedule trigger.
  pull_request:
    types: [opened]
permissions:
  contents: read
jobs:
  qualification:
    if: github.event.pull_request.head.ref == 'experiment/approved-model-retry-once'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Run the approved bounded synthetic experiment
        run: python3 scripts/qualify-approved-model.py
      - name: Preserve qualification evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: approved-model-evidence
          path: model-evidence/
