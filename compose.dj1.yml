name: unison-dj1

services:
  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 2s
      retries: 30

  auth:
    build:
      context: ./unison-auth
    environment:
      REDIS_HOST: redis
      UNISON_AUTH_BOOTSTRAP_TOKEN: dj1-bootstrap-token
      UNISON_AUTH_IDENTITY_DATABASE_PATH: /data/identity.db
      OTEL_SDK_DISABLED: "true"
    # This is an ephemeral acceptance profile. UID-owned tmpfs keeps the
    # non-root auth runtime writable without persisting fixture identities or keys.
    tmpfs:
      - /data:uid=1000,gid=1000,mode=0700
      - /app/keys:uid=1000,gid=1000,mode=0700
    ports:
      - "18088:8088"
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8088/"]
      interval: 2s
      timeout: 2s
      retries: 30

  storage:
    build:
      context: ./unison-storage
      args:
        UNISON_COMMON_REF: 45a261eb1442454c4541b75dcb6f43b8bb32027f
    environment:
      UNISON_AUTH_SERVICE_URL: http://auth:8088
      OTEL_SDK_DISABLED: "true"
      UNISON_INCIDENTS_ROOT: /data/incidents
    volumes:
      - dj1-storage:/data
    ports:
      - "18082:8082"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8082/healthz"]
      interval: 2s
      timeout: 2s
      retries: 30
    depends_on:
      auth:
        condition: service_healthy

  renderer:
    build:
      context: ./unison-experience-renderer
      args:
        UNISON_COMMON_REF: 45a261eb1442454c4541b75dcb6f43b8bb32027f
    environment:
      UNISON_AUTH_SERVICE_URL: http://auth:8088
      OTEL_SDK_DISABLED: "true"
      UNISON_REDACT_RENDERER_EVENTS: "true"
    ports:
      - "18092:8082"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8082/health"]
      interval: 2s
      timeout: 2s
      retries: 30
    depends_on:
      auth:
        condition: service_healthy

  orchestrator:
    build:
      context: ./unison-orchestrator
      args:
        UNISON_COMMON_REF: 45a261eb1442454c4541b75dcb6f43b8bb32027f
    environment:
      UNISON_AUTH_SERVICE_URL: http://auth:8088
      OTEL_SDK_DISABLED: "true"
      UNISON_STORAGE_HOST: storage
      UNISON_STORAGE_PORT: "8082"
      UNISON_RENDERER_HOST: renderer
      UNISON_RENDERER_PORT: "8082"
      UNISON_INCIDENT_OUTBOX_ROOT: /data/incident-outbox
    volumes:
      - dj1-outbox:/data
    ports:
      - "18080:8080"
    depends_on:
      auth:
        condition: service_healthy
      storage:
        condition: service_healthy
      renderer:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/health"]
      interval: 2s
      timeout: 2s
      retries: 30

volumes:
  dj1-storage:
  dj1-outbox:
