services:
  phase6-minio:
    image: quay.io/minio/minio:RELEASE.2025-07-23T15-54-02Z
    command: server /data
    environment:
      MINIO_ROOT_USER: phase6-test-access
      MINIO_ROOT_PASSWORD: phase6-test-secret-only
    ports:
      - "127.0.0.1:19000:9000"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 2s
      timeout: 2s
      retries: 30
    tmpfs:
      - /data
